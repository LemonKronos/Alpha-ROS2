low_spatial:
  ros__parameters:
    voxel_resolution: 0.25
    truncation_distance: 2.0 # the step size in sdf
    max_weight: 100.0 # How much can a voxel get update
    voxel_carving_enabled: true
    use_weight_dropoff: true # Allow blends overlapping scans and smooths out the bumps

    max_ray_length: 20.0
    sparsity_compensation_factor: 2.0 # help sparse ray to have more weight

    esdf_min_distance: 0.0
    esdf_max_distance: 10.0
    esdf_default_distance: 10.0