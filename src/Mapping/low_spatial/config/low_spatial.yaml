low_spatial:
  ros__parameters:
    voxel_resolution: 0.25
    truncation_distance: 1.0 # the step size in sdf
    max_weight: 100.0 # How much can a voxel get update
    voxel_carving_enabled: true
    use_weight_dropoff: true # Allow blends overlapping scans and smooths out the bumps
    integrator_threads: 4 # threads inside each integratePointCloud; fewer = shorter write-lock holds

    dense_max_ray_length: 10.0
    max_ray_length: 20.0
    sparsity_compensation_factor: 2.0 # help sparse ray to have more weight

    esdf_full_euclidean: true
    esdf_min_distance: 0.2 # MUST be > 0 and <= truncation_distance: TSDF voxels with |d| < this seed the ESDF wavefront
    esdf_max_distance: 15.0 # keep a bit above the OA push distance; larger = much more expensive updates
    esdf_default_distance: 16.0 # must be > esdf_max_distance